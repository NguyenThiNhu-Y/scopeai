# Preview stack (M1) — theo skill app-preview.
# Một origin duy nhất: frontend vite :3000 tự proxy /api -> backend:8000.
# (Không dùng Caddy/nginx phía trước: với Vite, vite preview proxy là đủ — skill §Run rule 2c.)
# LƯU Ý: KHÔNG dùng cổng 5173 — cổng này bị môi trường session chặn (redirect sang egress gateway).
services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - .env.preview
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./sample_data:/sample_data:ro
      - ./docs:/app/docs:ro
    environment:
      # Keep these explicit preview overrides; env_file supplies LLM settings.
      DATABASE_URL: sqlite:////app/data/bidding.db
      APP_ENV: preview
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
      LLM_VERIFY_SSL: "false"
      # ĐỢT 12: buộc mock để không gọi LLM thật khi kiểm thử (AGENTS.md quy tắc 3).
      LLM_PROVIDER: mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 0s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "npm ci &&
             npx vite build &&
             node -e \"const http=require('http');let n=0;const t=setInterval(()=>{if(++n>90){console.error('[preview] backend not ready after 180s');process.exit(1)}const r=http.get('http://backend:8000/api/health',res=>{res.resume();if(res.statusCode===200){clearInterval(t);console.log('[preview] backend ready');process.exit(0)}});r.on('error',()=>{})},2000)\" &&
             npx vite preview --config vite.preview.config.ts --host 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - fe_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fe_node_modules: {}
